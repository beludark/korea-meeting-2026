<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corée 2026</title>
<style>
:root{--ink:#111;--mute:#767676;--line:#e6e6e6;--ok:#1a7f5a;--warn:#b45309;--pink:#c2417a;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px}
.top{position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:640px;margin:0 auto;padding:12px 16px 0}
h1{font-size:22px;margin:0 0 8px}
.tabs{display:flex;gap:20px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 0;font:inherit;color:var(--mute);cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;border-color:var(--ink)}
button,select,input{font:inherit}
input,select{font-size:16px;padding:9px 10px;border:1px solid #d6d6d6;border-radius:8px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
:focus-visible{outline:2px solid #111;outline-offset:2px}
.day{border-bottom:1px solid var(--line);padding:6px 0 10px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.dh span{font-weight:600}.dh span::first-letter{text-transform:uppercase}
.add{border:0;background:none;color:var(--ink);font-weight:600;padding:6px 0 6px 12px;cursor:pointer}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
.row:hover{border-color:#bbb}
.tm{width:46px;flex:none;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.who{flex:1;min-width:0}
.who small{display:block;color:var(--mute);font-size:13px}
.cont{background:#f7f7f7;border-style:dashed;color:var(--mute);cursor:pointer}
.nb{font-size:11px;background:#111;color:#fff;border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pink);margin-left:6px}
.st{font-size:12px;flex:none}.s0{color:var(--warn)}.s1{color:var(--ok)}.s2{color:var(--mute)}
.warnl{color:var(--warn);font-size:13px;padding:0 0 4px}
.free{color:#b0b0b0;font-size:14px;padding:4px 0}
.over{outline:2px dashed #111;outline-offset:2px}
.bar2{display:flex;gap:10px;padding:14px 0}
.b1{background:#111;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.b2{background:#fff;border:1px solid #d0d0d0;border-radius:8px;padding:9px 14px;cursor:pointer}
.lnk{background:none;border:0;color:#c0392b;cursor:pointer;margin-right:auto;padding:9px 0}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:24px 0;color:var(--mute);font-size:13px}
.foot .b2{font-size:13px;padding:6px 10px}
.empty{color:var(--mute);padding:16px 0}
dialog{border:0;border-radius:14px;padding:20px;width:min(460px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 14px;font-size:18px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.g .full{grid-column:1/-1}
.g label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.g label.chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.bar{display:flex;gap:8px;justify-content:flex-end}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gbox{text-align:center;width:min(340px,100%)}
.gbox code{word-break:break-all;display:block;margin-top:6px;color:var(--ink)}
</style>
</head>
<body>
<div id="gate"><div class="gbox"><h1>Corée 2026</h1><p style="color:var(--mute)">Accès privé</p>
<div style="display:grid;gap:10px;margin-bottom:12px"><input id="em" type="email" placeholder="Adresse e-mail" autocomplete="username"><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password"></div>
<button class="b1" id="login" style="width:100%">Se connecter</button><p id="gmsg" style="color:var(--warn);font-size:14px"></p></div></div>

<div id="app" hidden>
 <header class="top"><div class="in"><h1>Corée 2026</h1>
  <div class="tabs"><button class="tab" id="t-plan" aria-selected="true">Planning</button><button class="tab" id="t-people" aria-selected="false">Personnes</button></div></div></header>
 <div class="wrap">
  <section id="v-plan"></section>
  <section id="v-people" hidden>
   <div class="bar2"><input id="q" placeholder="Rechercher une personne"><button class="b1" data-addp="1">+ Personne</button></div>
   <div id="plist"></div>
  </section>
  <div class="foot"><button class="b2" id="exp">Exporter une sauvegarde</button><label class="b2"><input type="file" id="imp" accept=".json" hidden>Importer</label><button class="b2" id="out">Se déconnecter</button><span id="sync"></span></div>
 </div>
</div>
<dialog id="dlg"></dialog>

<script>
var CITIES=["Séoul","Cheonan","Daejeon","Busan","Daegu","Jeonju","Jeju","Autre"],START="2026-10-26",NDAYS=17,STS=["à confirmer","confirmé","fait"];
var people=[],meetings=[],editM=null,editP=null,dragId=null,q="";
var $=function(i){return document.getElementById(i)};
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function qa(s){return esc(s).replace(/"/g,"&quot;")}
function newId(){var m=0;people.concat(meetings).forEach(function(x){if(x.id>m)m=x.id});return m+1}
function P(id){return people.find(function(p){return p.id===id})}
function dstr(i,o){var d=new Date(START+"T12:00:00");d.setDate(d.getDate()+i-1);return d.toLocaleDateString("fr-FR",o)}
function byTime(a,b){return (a.time||"99").localeCompare(b.time||"99")}
function sel(list,v){return list.map(function(c){return '<option'+(c===v?' selected':'')+'>'+c+'</option>'}).join("")}
function timeOpts(v){var o='<option value="">--:--</option>';for(var m=0;m<1440;m+=15){var t=('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2);o+='<option'+(t===v?' selected':'')+'>'+t+'</option>'}return o}
function getData(){return {people:people,meetings:meetings}}
function applyData(d){
 if(!d)return;
 if(d.people){people=d.people;meetings=d.meetings||[];return}
 if(d.friends){ /* ancien format */
  people=[];meetings=[];
  d.friends.forEach(function(f){people.push({id:f.id,name:f.name,city:f.city,note:f.note||"",tag:!!f.tag})});
  d.friends.forEach(function(f){if(f.day)meetings.push({id:newId(),pid:f.id,day:f.day,time:f.time||"",city:f.city,place:f.place||"",note:"",status:f.status==="confirmé"?"confirmé":f.status==="vu"?"fait":"à confirmer",night:false})});
 }
}
try{var s0=localStorage.getItem("coree-v3")||localStorage.getItem("coree-v2");if(s0)applyData(JSON.parse(s0))}catch(e){}
function save(){try{localStorage.setItem("coree-v3",JSON.stringify(getData()))}catch(e){}if(window.cloudSave)window.cloudSave()}
function commit(){save();render()}

function rowHtml(m){var p=P(m.pid)||{};
 return '<div class="row" draggable="true" data-mid="'+m.id+'"><span class="tm">'+(m.time||"–")+'</span><div class="who"><b>'+esc(p.name||"?")+'</b>'+(p.tag?'<i class="dot"></i>':'')+(m.night?'<span class="nb">Nuit</span>':'')+'<small>'+esc([m.city,m.place].filter(Boolean).join(" · "))+'</small></div><span class="st s'+STS.indexOf(m.status)+'">'+m.status+'</span></div>'}
function renderPlan(){
 var h="";
 for(var i=1;i<=NDAYS;i++){
  var ms=meetings.filter(function(m){return m.day===i}).sort(byTime);
  var prev=meetings.filter(function(m){return m.day===i-1&&m.night});
  h+='<section class="day" data-day="'+i+'"><div class="dh"><span>'+dstr(i,{weekday:"long",day:"numeric",month:"long"})+'</span><button class="add" data-add="'+i+'">+ Ajouter</button></div>';
  prev.forEach(function(m){h+='<div class="row cont" data-mid="'+m.id+'"><span class="tm">Nuit</span><div class="who">Suite de la nuit · '+esc((P(m.pid)||{}).name||"?")+'</div></div>'});
  h+=ms.map(rowHtml).join("");
  if(!ms.length&&!prev.length)h+='<div class="free">Libre</div>';
  var cs=[];ms.forEach(function(m){if(m.city&&cs.indexOf(m.city)<0)cs.push(m.city)});
  if(cs.length>1)h+='<div class="warnl">⚠ Plusieurs villes ce jour : '+cs.join(", ")+'. Vérifiez les trajets.</div>';
  var ts=ms.map(function(m){return m.time}).filter(Boolean);
  if(ts.length!==new Set(ts).size)h+='<div class="warnl">⚠ Deux rendez-vous à la même heure.</div>';
  h+='</section>';
 }
 $("v-plan").innerHTML=h;
}
function renderPeople(){
 var l=people.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return a.name.localeCompare(b.name)});
 $("plist").innerHTML=l.length?l.map(function(p){
  var ms=meetings.filter(function(m){return m.pid===p.id}).sort(function(a,b){return a.day-b.day||byTime(a,b)});
  return '<div class="row" data-pid="'+p.id+'"><div class="who"><b>'+esc(p.name)+'</b>'+(p.tag?'<i class="dot"></i>':'')+'<small>'+esc(p.city)+(p.note?' · '+esc(p.note):'')+'</small><small>'+(ms.length?ms.map(function(m){return 'J'+m.day+(m.time?' '+m.time:'')+(m.night?' (nuit)':'')}).join(" · "):'Pas encore de rendez-vous')+'</small></div></div>'}).join(""):'<p class="empty">Aucune personne pour l’instant.</p>';
}
function render(){renderPlan();renderPeople()}

function openMeeting(id,day){
 var m=id?meetings.find(function(x){return x.id===id}):null;
 var sp=people.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
 var cur=m?{pid:m.pid,day:m.day,time:m.time,city:m.city,place:m.place,note:m.note,status:m.status,night:m.night}:{pid:sp.length?sp[0].id:"new",day:day||1,time:"",city:sp.length?sp[0].city:"Séoul",place:"",note:"",status:"à confirmer",night:false};
 editM=id||null;
 var days=Array.from({length:NDAYS},function(_,i){return '<option value="'+(i+1)+'"'+(cur.day===i+1?' selected':'')+'>'+dstr(i+1,{weekday:"short",day:"numeric",month:"short"})+'</option>'}).join("");
 $("dlg").innerHTML='<h3>'+(id?'Modifier le rendez-vous':'Nouveau rendez-vous')+'</h3><div class="g">'
 +'<label class="full">Personne<select id="m-p">'+sp.map(function(p){return '<option value="'+p.id+'"'+(p.id===cur.pid?' selected':'')+'>'+esc(p.name)+'</option>'}).join("")+'<option value="new"'+(cur.pid==="new"?' selected':'')+'>+ Nouvelle personne</option></select></label>'
 +'<div class="full g" id="newbox" style="margin:0"'+(cur.pid==="new"?'':' hidden')+'><label>Prénom<input id="m-nn"></label><label class="chk"><input type="checkbox" id="m-nt"> Pastille</label></div>'
 +'<label>Jour<select id="m-day">'+days+'</select></label><label>Heure<select id="m-time">'+timeOpts(cur.time)+'</select></label>'
 +'<label>Ville<select id="m-city">'+sel(CITIES,cur.city)+'</select></label><label>Statut<select id="m-st">'+sel(STS,cur.status)+'</select></label>'
 +'<label class="full">Lieu<input id="m-place" value="'+qa(cur.place)+'" placeholder="Café, quartier, hôtel..."></label>'
 +'<label class="chk full"><input type="checkbox" id="m-night"'+(cur.night?' checked':'')+'> Nuit</label>'
 +'<label class="full">Note<input id="m-note" value="'+qa(cur.note)+'"></label></div>'
 +'<div class="bar">'+(id?'<button class="lnk" id="m-del">Supprimer</button>':'')+'<button class="b2" id="m-cancel">Annuler</button><button class="b1" id="m-save">Enregistrer</button></div>';
 $("dlg").showModal();
}
function saveMeeting(){
 var v=function(i){return $(i).value},pid=v("m-p");
 if(pid==="new"){var nn=v("m-nn").trim();if(!nn){$("m-nn").focus();return}
  var p={id:newId(),name:nn,city:v("m-city"),note:"",tag:$("m-nt").checked};people.push(p);pid=p.id}else pid=+pid;
 var o={pid:pid,day:+v("m-day"),time:v("m-time"),city:v("m-city"),place:v("m-place").trim(),note:v("m-note").trim(),status:v("m-st"),night:$("m-night").checked};
 if(editM){Object.assign(meetings.find(function(x){return x.id===editM}),o)}else{o.id=newId();meetings.push(o)}
 $("dlg").close();commit();
}
function delMeeting(){meetings=meetings.filter(function(x){return x.id!==editM});$("dlg").close();commit()}
function openPerson(id){
 var p=id?P(id):{name:"",city:"Séoul",note:"",tag:false};editP=id||null;
 $("dlg").innerHTML='<h3>'+(id?'Modifier la personne':'Nouvelle personne')+'</h3><div class="g">'
 +'<label>Prénom<input id="p-name" value="'+qa(p.name)+'"></label><label>Ville<select id="p-city">'+sel(CITIES,p.city)+'</select></label>'
 +'<label class="full">Note<input id="p-note" value="'+qa(p.note)+'" placeholder="Comment vous vous connaissez..."></label>'
 +'<label class="chk full"><input type="checkbox" id="p-tag"'+(p.tag?' checked':'')+'> Pastille</label></div>'
 +'<div class="bar">'+(id?'<button class="lnk" id="p-del">Supprimer</button>':'')+'<button class="b2" id="p-cancel">Annuler</button><button class="b1" id="p-save">Enregistrer</button></div>';
 $("dlg").showModal();
}
function savePerson(){
 var n=$("p-name").value.trim();if(!n){$("p-name").focus();return}
 var o={name:n,city:$("p-city").value,note:$("p-note").value.trim(),tag:$("p-tag").checked};
 if(editP)Object.assign(P(editP),o);else{o.id=newId();people.push(o)}
 $("dlg").close();commit();
}
function delPerson(){
 var p=P(editP);if(!p||!confirm("Supprimer "+p.name+" et ses rendez-vous ?"))return;
 people=people.filter(function(x){return x.id!==editP});meetings=meetings.filter(function(m){return m.pid!==editP});
 $("dlg").close();commit();
}
function setView(v){$("v-plan").hidden=v!=="plan";$("v-people").hidden=v!=="people";$("t-plan").setAttribute("aria-selected",v==="plan");$("t-people").setAttribute("aria-selected",v==="people");window.scrollTo(0,0)}

document.addEventListener("click",function(e){
 var t=e.target,c;
 if(c=t.closest("[data-add]")){openMeeting(null,+c.dataset.add);return}
 if(c=t.closest("[data-mid]")){openMeeting(+c.dataset.mid);return}
 if(c=t.closest("[data-pid]")){openPerson(+c.dataset.pid);return}
 if(t.closest("[data-addp]")){openPerson(null);return}
 var id=t.id;
 if(id==="t-plan")setView("plan");else if(id==="t-people")setView("people");
 else if(id==="m-cancel"||id==="p-cancel")$("dlg").close();
 else if(id==="m-save")saveMeeting();else if(id==="m-del")delMeeting();
 else if(id==="p-save")savePerson();else if(id==="p-del")delPerson();
});
document.addEventListener("change",function(e){
 if(e.target.id==="m-p"){var v=e.target.value;$("newbox").hidden=v!=="new";if(v!=="new"){var p=P(+v);if(p)$("m-city").value=p.city}}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value.toLowerCase();renderPeople()}});
function clearOver(){document.querySelectorAll(".over").forEach(function(x){x.classList.remove("over")})}
document.addEventListener("dragstart",function(e){var r=e.target.closest&&e.target.closest("[draggable][data-mid]");if(r){dragId=+r.dataset.mid;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragId))}});
document.addEventListener("dragover",function(e){var d=e.target.closest&&e.target.closest(".day");if(d&&dragId){e.preventDefault();clearOver();d.classList.add("over")}});
document.addEventListener("drop",function(e){var d=e.target.closest&&e.target.closest(".day");if(d&&dragId){e.preventDefault();var m=meetings.find(function(x){return x.id===dragId});if(m)m.day=+d.dataset.day;dragId=null;commit()}});
document.addEventListener("dragend",function(){dragId=null;clearOver()});
$("exp").addEventListener("click",function(){
 var b=new Blob([JSON.stringify(getData())],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="coree-sauvegarde.json";a.click();
});
$("imp").addEventListener("change",function(e){
 var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var o=JSON.parse(r.result);if(o&&(o.people||o.friends)){applyData(o);commit()}else alert("Fichier non valide.")}catch(x){alert("Fichier non valide.")}};
 r.readAsText(f);
});
render();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyBPME6NHyEHC6OFAlAb9pyLrEBqMalf3QA",
  authDomain:"korea-meeting-2026.firebaseapp.com",
  projectId:"korea-meeting-2026",
  storageBucket:"korea-meeting-2026.firebasestorage.app",
  messagingSenderId:"454731071840",
  appId:"1:454731071840:web:152258df9c3a66f0cd9e05"
});
const auth=getAuth(app),db=getFirestore(app),ref=doc(db,"trips","coree2026");
const $=id=>document.getElementById(id);
const status=t=>{$("sync").textContent=t};
let loaded=false,timer=null,unsub=null;const mine=new Set();
window.cloudSave=function(){
  if(!loaded)return;
  clearTimeout(timer);status("Enregistrement…");
  timer=setTimeout(async()=>{
    const ts=Date.now();mine.add(ts);
    try{await setDoc(ref,{...JSON.parse(JSON.stringify(window.getData())),updated:ts});status("Enregistré")}
    catch(e){status("Erreur de sauvegarde")}
  },600);
};
$("login").onclick=async()=>{
  $("gmsg").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){
    const m={"auth/invalid-credential":"E-mail ou mot de passe incorrect.","auth/invalid-email":"Adresse e-mail invalide.","auth/too-many-requests":"Trop d'essais, réessayez dans quelques minutes."};
    $("gmsg").textContent=m[e.code]||("Connexion impossible ("+(e.code||"erreur")+")");
  }
};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("login").click()});
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
  if(unsub){unsub();unsub=null}
  loaded=false;
  if(!user){$("gate").hidden=false;$("app").hidden=true;return}
  $("gate").hidden=true;$("app").hidden=false;status("Chargement…");
  unsub=onSnapshot(ref,snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists()){
      const d=snap.data();
      if(d.updated&&mine.has(d.updated)){status("Enregistré");return}
      window.applyData(d);window.render();
      if(!d.people)window.cloudSave();
      loaded=true;status("Synchronisé");
      if(!d.people)window.cloudSave();
    }else{loaded=true;window.cloudSave()}
  },err=>{
    $("gate").hidden=false;$("app").hidden=true;
    $("gmsg").innerHTML="Accès refusé. Ajoutez cet identifiant dans les règles Firestore :<code>"+user.uid+"</code>";
  });
});
</script>
</body>
</html>
